# The secret only exists on the server. HS512 needs at least 64 characters.
secret=somerandomsecret1234SOMERANDOMSECRETLifeCanBeMeaningful1234SOMERANDOMSECRETLifeCanBeGo
# H2: a database inside the program. Nothing to install; it is empty again after every restart.
spring.datasource.url=jdbc:h2:mem:jwtdb
spring.jpa.hibernate.ddl-auto=create-drop
# We check usernames and passwords ourselves, so Spring should not make its own default user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# Hide the database info lines Hibernate prints at startup
logging.level.org.hibernate.orm.connections.pooling=WARN
